# ============================================================
# 网关仅保留非敏感结构配置；Redis/JWT/内部令牌/服务地址由指定 Nacos namespace 提供。
# ============================================================
server:
  port: 9088

spring:
  application:
    name: loan-gateway
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    gateway:
      routes:
        - id: loan-service
          uri: ${loan.service.route-uri}
          predicates:
            - Path=/loan/**
logging:
  # 不使用 Spring Boot 默认的 %-15.15thread，避免控制台出现 [           main] 的定宽前导空格。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.loan.gateway: info
