<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>企融通移动端·代码同步原型 2026-09-12</title>
<style>
:root{--ink:#111e36;--ink2:#1b2c4d;--blue:#2c52c9;--gold:#c7a15a;--bg:#f5f7fb;--card:#fff;--muted:#6a768c;--line:#e7ebf2}*{box-sizing:border-box}body{margin:0;background:#e7eaf0;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.bar{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:12px 18px;background:#111e36;color:#fff;flex-wrap:wrap}.bar b{margin-right:auto}.bar button{border:1px solid #435579;background:#1b2c4d;color:#dbe5f7;border-radius:8px;padding:7px 12px}.bar button.on{background:var(--gold);color:#211705;border-color:var(--gold)}.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px;flex-wrap:wrap}.device{width:390px;height:820px;background:#0b1220;border-radius:38px;padding:10px;box-shadow:0 24px 60px #24324c55}.screen{height:100%;overflow:hidden;border-radius:30px;background:var(--bg);display:flex;flex-direction:column}.scroll{overflow:auto;flex:1;padding-bottom:72px}.hero{padding:28px 20px 24px;background:radial-gradient(circle at 90% 0,#c7a15a55,transparent 38%),linear-gradient(160deg,var(--ink),var(--ink2));color:#fff}.user{display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:#e7edf8;color:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:800}.bell{margin-left:auto;font-size:22px}.hero h2{margin:14px 0 4px;font-size:21px}.hero p{margin:0;color:#bdc9dc;font-size:12px;white-space:nowrap}.pill{display:inline-block;margin-top:12px;padding:5px 10px;border:1px solid #c7a15a66;border-radius:99px;color:#e7d3a6;font-size:11px}.body{padding:16px}.stats{display:flex;gap:10px;margin-top:-2px}.stat,.card,.quick{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 16px #1120360b}.stat{flex:1;padding:14px}.stat strong{display:block;font-size:20px}.stat small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.quick{padding:14px;min-height:96px}.quick .ico{width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;margin-bottom:10px}.quick b{display:block;white-space:nowrap}.quick small{color:var(--muted);white-space:nowrap}.card{padding:15px;margin:12px 0}.card h3{font-size:15px;margin:0 0 10px}.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.main{flex:1;min-width:0}.main b,.main small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main small{color:var(--muted);margin-top:4px}.tag{font-size:11px;padding:4px 8px;border-radius:99px;background:#eef1f6;color:#53627b;white-space:nowrap}.tag.ok{background:#e7f4ee;color:#2e8b6b}.tag.warn{background:#fbf1de;color:#b5781f}.tabs{height:66px;background:#fff;border-top:1px solid var(--line);display:flex}.tabs span{flex:1;text-align:center;padding-top:13px;color:#6a768c;font-size:11px;white-space:nowrap}.tabs span.on{color:var(--blue);font-weight:700}.tabs i{display:block;font-style:normal;font-size:21px;height:28px}.search{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);margin-bottom:10px}.chips{display:flex;gap:7px;overflow:auto}.chips span{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:6px 11px;color:var(--muted);font-size:12px}.chips span.on{background:var(--ink);color:#fff}.note{color:var(--muted);font-size:11px;text-align:center;padding:20px 8px}.legend{max-width:860px;margin:0 auto 24px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;color:#53627b;line-height:1.8}.legend strong{color:var(--ink)}
</style></head><body>
<div class="bar"><b>企融通 · H5 / 小程序代码同步原型</b><button class="role on" data-role="customer">客户</button><button class="role" data-role="channel">渠道</button><button class="role" data-role="adviser">顾问</button><button class="role" data-role="deptmgr">部门经理</button><button class="role" data-role="operator">运营</button><button class="role" data-role="boss">老板</button><button class="role" data-role="super">超级管理员</button></div>
<div class="stage"><div><div style="text-align:center;color:#53627b;margin-bottom:8px">微信小程序</div><div class="device"><div class="screen" id="mini"></div></div></div><div><div style="text-align:center;color:#53627b;margin-bottom:8px">H5（同源 uni-app）</div><div class="device"><div class="screen" id="h5"></div></div></div></div>
<div class="legend"><strong>本版与当前代码同步的确认点</strong><br>① 首页使用墨蓝 Hero、头像授权、消息红点、角色标签和动态快捷宫格；② TabBar 按角色和精确权限生成，顾问无审批中心，具备审批权限的角色显示审批中心；③ 我的页面按客户/渠道/员工区分业务录入、客户、工单、审批与邀请；④ 客户搜索支持身份证、统一社会信用代码、企业名称、联系人、手机号；⑤ 审批展示提交人、事项、状态、时间，不展示审批号/业务编码；⑥ H5 与微信小程序采用同一套页面结构。</div>
<script>
const cfg={customer:{name:'微信客户',role:'客户',tabs:['首页','智能匹配','我的报告','服务单','我的'],quick:['智能匹配','我的报告','服务单'],stats:['—','匹配次数','0','服务单']},channel:{name:'渠道合作方',role:'渠道',tabs:['首页','线索录入','我的客户','我的'],quick:['录入线索','录入产品','我的客户'],stats:['—','我的线索','—','已转化'],lead:true},adviser:{name:'李顾问',role:'顾问',tabs:['首页','线索录入','我的客户','我的'],quick:['新增线索','新增产品','认领公海','我的客户'],stats:['—','我的客户','—','待跟进']},deptmgr:{name:'王经理',role:'部门经理',tabs:['首页','线索录入','我的客户','审批中心','我的'],quick:['团队客户','分配客户','审批中心','新增线索'],stats:['—','团队客户','—','待审批'],approval:true},operator:{name:'赵运营',role:'运营',tabs:['首页','线索录入','我的客户','审批中心','我的'],quick:['新增线索','新增产品','营销短信','审批中心'],stats:['—','公司客户','—','待审批'],approval:true},boss:{name:'陈老板',role:'老板',tabs:['首页','线索录入','智能匹配','我的客户','我的'],quick:['新增线索','新增产品','智能匹配','全司客户'],stats:['—','全司客户','—','在途审批'],approval:true},super:{name:'钱超级',role:'超级管理员',tabs:['首页','线索录入','智能匹配','我的客户','我的'],quick:['组织权限','新增产品','智能匹配','全司客户'],stats:['—','全平台客户','—','系统待办'],approval:true}};
let role='customer';function render(id){let c=cfg[role],html=`<div class="scroll"><div class="hero"><div class="user"><div class="avatar">${c.name[0]}</div><div><small>下午好</small><h2>${c.name}</h2></div><div class="bell">♧</div></div><p>${c.role}工作台 · 数据来自当前账号权限</p><span class="pill">${c.role}</span></div><div class="body"><div class="stats"><div class="stat"><strong>${c.stats[0]}</strong><small>${c.stats[1]}</small></div><div class="stat"><strong>${c.stats[2]}</strong><small>${c.stats[3]}</small></div></div><div class="grid">${c.quick.map((x,i)=>`<div class="quick"><div class="ico">${['◉','＋','▣','✓'][i%4]}</div><b>${x}</b><small>${x==='审批中心'?'待我审批':'进入功能'}</small></div>`).join('')}</div>${c.approval?'<div class="card"><h3>审批待办</h3><div class="row"><div class="main"><b>提交人：渠道合作方</b><small>事项：客户分配申请 · 今天</small></div><span class="tag warn">待审批</span></div></div>':''}${c.lead?'<div class="card"><h3>我的线索</h3><div class="row"><div class="main"><b>新增企业客户</b><small>提交时间 · 审核状态</small></div><span class="tag">待审核</span></div></div>':''}<div class="card"><h3>${role==='customer'?'顾问服务':'消息通知'}</h3><div class="row"><div class="main"><b>${role==='customer'?'暂未分配服务顾问':'暂无未读消息'}</b><small>${role==='customer'?'管理员分配或顾问从公海认领后展示':'提交人 + 事项 + 时间'}</small></div></div></div><div class="note">合规提示：匹配结果仅供参考，不代表资金机构通过承诺</div></div></div><div class="tabs">${c.tabs.map((x,i)=>`<span class="${i===0?'on':''}"><i>${['⌂','⌕','▤','✓','♙'][i%5]}</i>${x}</span>`).join('')}</div>`;document.getElementById(id).innerHTML=html}function all(){render('mini');render('h5')}document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{document.querySelectorAll('.role').forEach(x=>x.classList.remove('on'));b.classList.add('on');role=b.dataset.role;all()});all();
</script></body></html>
