# ============================================================
# loan-platform Nacos 配置（dev 命名空间 · dataId=application.properties · group=loan）
# 参考 tse 分层：业务与基础设施在此配置，本地 application.properties 只留固定引导
# 执行导入：NACOS_SERVER_ADDR=127.0.0.1:8848 bash loan-platform/nacos/scripts/import-config.sh dev
# ============================================================

# ---- 服务 ----
server.servlet.context-path=/loan
server.port=8080

# ---- 数据源（MySQL 8，全库 utf8mb4_0900_ai_ci）----
spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.druid.url=jdbc:mysql://127.0.0.1:3306/loan_db?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.druid.username=root
spring.datasource.druid.password=CHANGE_ME
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000

# ---- Redis（二级缓存 + 会话）----
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=3000

# ---- MyBatis-Plus ----
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false

# ---- Caffeine（一级缓存）+ Redis 二级缓存 ----
spring.cache.type=caffeine

# ---- 第三方服务密钥（第二十二轮：密钥走 Nacos + t_config 双通道，此处为默认值，后台可覆盖）----
loan.tencent.ocr.secret-id=
loan.tencent.ocr.secret-key=
loan.tencent.ocr.region=ap-guangzhou
loan.qwen-vl.api-key=
loan.qwen-vl.model=qwen-vl-max
loan.tencent.sms.secret-id=
loan.tencent.sms.secret-key=
loan.oss.mode=local
loan.oss.aliyun.bucket=
loan.oss.aliyun.access-key-id=
loan.oss.aliyun.access-key-secret=
