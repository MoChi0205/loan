# =============================================================================
# LOAN 后端 — Nacos dev（本地 Docker，唯一配置源）
# 发布: bash nacos/scripts/import-config.sh dev
# dataId=application.properties | group=loan | namespace=dev
# 勿新增 yml；prd 由本文件对照生成 config/prd/application.properties
# =============================================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/loan
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# --- Spring ---
spring.application.name=loan-platform
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# --- MySQL（Docker Compose 服务名 mysql；loan_db 需先用 root/Erp@Root2024! 创建并授权 erp_user）---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/loan_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&connectionCollation=utf8mb4_0900_ai_ci&allowPublicKeyRetrieval=true
spring.datasource.username=erp_user
spring.datasource.password=Erp@User2024!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.max-active=30
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-wait=60000
spring.datasource.druid.validation-query=SELECT 'x'
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000

# --- Druid 慢 SQL 监控（dev 500ms；搜 "slow sql"）---
spring.datasource.druid.filters=stat
spring.datasource.druid.filter.stat.enabled=true
spring.datasource.druid.filter.stat.log-slow-sql=true
spring.datasource.druid.filter.stat.merge-sql=true
spring.datasource.druid.filter.stat.slow-sql-millis=500
spring.datasource.druid.stat-view-servlet.enabled=false

# --- Redis（二级缓存 + 会话；无密码）---
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=10000ms
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

# --- MyBatis-Plus / PageHelper ---
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.banner=false
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.params=count=countSql

# --- Caffeine 一级缓存 + Redis 二级缓存 ---
spring.cache.type=caffeine

# --- JWT ---
jwt.secret=loan-platform-jwt-secret-key-2026
jwt.expire=86400000

# --- 登录 RSA（import-config.sh 注入 PLACEHOLDER） ---
login.rsa.public-key-base64=PLACEHOLDER_RSA_PUBLIC
login.rsa.private-key-base64=PLACEHOLDER_RSA_PRIVATE

# --- 应用 / 网关信任 ---
app.frontend-base-url=http://localhost:3000
app.gateway.enabled=true
app.gateway.trust-only=false
app.gateway.internal-token=loan-gateway-internal-dev-2026

# --- API 访问日志 ---
loan.api.log.enabled=true
loan.api.log.service-trace-enabled=false
loan.api.log.brief=true
loan.api.log.max-body-length=1024
loan.api.log.slow-threshold-ms=3000
loan.api.log.error-stack-trace=false

# --- 登录安全（IP/归属地/时段/单点登录）---
loan.login.security.enabled=true
loan.login.security.single-session=true
loan.login.security.time-limit-enabled=false
loan.login.security.allowed-start-time=08:00
loan.login.security.allowed-end-time=22:00
loan.login.security.region-limit-enabled=false
loan.login.security.allowed-regions=中国,内网
loan.login.security.session-ttl-seconds=86400

# --- HTTP 限流（固定窗口）---
loan.rate-limit.enabled=true
loan.rate-limit.ip-max-requests-per-minute=300
loan.rate-limit.login-max-requests-per-minute-per-ip=100
loan.rate-limit.login-max-requests-per-minute-per-account=5

# --- 规则引擎（第 15 章定稿：规则=ruleCode Handler + 条件表达式后台可配，混合模式参考 mds V2）---
loan.rule.enabled=true
# 调试中心：空跑（dryRun）不落线上
loan.rule.debug-center.enabled=true
loan.rule.debug-center.shadow-only=true

# --- 报告合规（第 17/18 章定稿）---
# 客户端只展示档位（高/中/低）+ 可进件银行数/产品数，永不展示银行/产品名称；产品明细仅管理端审计可见
loan.report.client-tier-only=true
# 档位聚合规则随报告模板版本配置（引擎输出不变，档位是展示层聚合）
loan.report.tier.high=HIGH
loan.report.tier.mid=MID
loan.report.tier.low=LOW
# 报告免责声明双落（尾页+结果页页脚）
loan.report.disclaimer.enabled=true
# 资料查看/下载统一动态水印 + 免责三重落点
loan.report.watermark.enabled=true
# 无水印下载走审批，24h 限时链接
loan.report.watermark-free-download.approval-hours=24

# --- 邀请奖励（第 19 章定稿）---
# 仅受邀用户有效；发 1 层存 2 层封顶；话术避返现/佣金敏感词；最终解释权归我司
loan.reward.enabled=true
loan.reward.max-layers=2
loan.reward.only-invited=true
loan.reward.banned-keywords=返现,佣金

# --- VIP 双轨身份（第 20 章定稿）---
loan.vip.enabled=true
loan.vip.default-tier=NONE

# --- 微信（支付/商家转账到零钱）---
loan.weixin.pay.mch-id=
loan.weixin.pay.api-v3-key=
loan.weixin.pay.serial-no=
loan.weixin.pay.private-key-path=
loan.weixin.transfer.enabled=false

# --- OCR / AI 提取（第 22 章定稿：腾讯云专项 OCR + 通义 Qwen-VL，OcrStrategyFactory 策略工厂）---
loan.tencent.ocr.secret-id=
loan.tencent.ocr.secret-key=
loan.tencent.ocr.region=ap-guangzhou
loan.qwen-vl.api-key=
loan.qwen-vl.model=qwen-vl-max

# --- 对象存储（local 开发 / cos 生产，OssStorageService 策略切换）---
loan.oss.mode=local
loan.oss.local-base-path=/app/data/oss-storage
loan.oss.aliyun.bucket=
loan.oss.aliyun.access-key-id=
loan.oss.aliyun.access-key-secret=
loan.oss.cos.enabled=false
loan.oss.cos.region=ap-shanghai
loan.oss.cos.secret-id=PLACEHOLDER_COS_SECRET_ID
loan.oss.cos.secret-key=PLACEHOLDER_COS_SECRET_KEY

# --- 短信（双层策略：SmsSendStrategy → SmsStrategyFactory → SmsChannelStrategy）---
sms.enabled=true
sms.default-channel=tencent
sms.sign-name=贷款咨询服务
sms.send-interval=60000
sms.daily-limit-per-phone=10
sms.daily-limit-total=10000
sms.channels.tencent.enabled=true
sms.channels.tencent.secret-id=PLACEHOLDER_TENCENT_SMS_ID
sms.channels.tencent.secret-key=PLACEHOLDER_TENCENT_SMS_KEY
sms.channels.mozi.enabled=false
sms.channels.aliyun.enabled=false

# --- 批量任务 ---
batch.job.default-chunk-size=50
batch.job.default-max-retry=3
batch.job.retry-scan-limit=20

# --- XXL-JOB ---
xxl.job.admin-addresses=http://xxl-job-admin:8080/xxl-job-admin
xxl.job.appname=loan-platform-executor
xxl.job.ip=
xxl.job.port=9999
xxl.job.access-token=PLACEHOLDER_XXL_ACCESS_TOKEN
xxl.job.log-path=/app/logs/xxl-job
xxl.job.log-retention-days=10

# --- Dubbo（开发直连 prd 时由 VM -Ddubbo.enabled=false 关闭）---
dubbo.enabled=true
dubbo.application.name=loan-platform
dubbo.application.qos-enable=false
dubbo.registry.address=nacos://127.0.0.1:8848
dubbo.registry.check=false
dubbo.protocol.name=dubbo
dubbo.protocol.port=20880
dubbo.provider.version=1.0.0
dubbo.provider.timeout=30000
dubbo.provider.retries=0
dubbo.consumer.version=1.0.0
dubbo.consumer.timeout=30000
dubbo.consumer.retries=0
dubbo.consumer.check=false
dubbo.scan.base-packages=com.loan.facade.impl

# --- 日志级别（log4j2 仍用 classpath:log4j2-spring.xml） ---
logging.level.com.loan=INFO
logging.level.org.mybatis=WARN
logging.level.org.springframework=INFO
