# ============================================================
# Bootstrap：Spring Cloud 服务发现（参考 tse 分层模式）
#
# Nacos 连接信息（与 tse 同实例，loan 独立 group=loan）：
#   dev 环境：-Dnacos.server-addr=127.0.0.1:8848   -Dnacos.namespace=dev
#   prd 环境：-Dnacos.server-addr=124.221.150.239:9848  -Dnacos.namespace=prd
#   Nacos 控制台账号：nacos / nacos（dev 未启用认证；prd 生产已改，见上线文档）
#   VM 必填：-Dnacos.server-addr=host:port  -Dnacos.namespace=dev|prd
# ============================================================
spring.cloud.nacos.server-addr=${nacos.server-addr}
spring.cloud.nacos.discovery.namespace=${nacos.namespace}
spring.cloud.nacos.discovery.group=${nacos.config.group:loan}
spring.cloud.nacos.config.enabled=false
