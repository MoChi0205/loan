# ============================================================
# 本地固定引导配置（不随 dev/prd 变化；环境由 VM -Dnacos.server-addr / -Dnacos.namespace 指定）
# 环境切换：VM 指定 -Dnacos.server-addr / -Dnacos.namespace=dev|prd
# 业务与基础设施（含 server.servlet.context-path=/loan、MySQL/Redis、第三方密钥）在 Nacos application.properties
# 开发启动：bash scripts/run-dev-prd.sh（直连 prd Nacos，不注册服务、关 Dubbo）
# ============================================================

spring.application.name=loan-platform
nacos.config.group=loan
nacos.config.server-addr=${nacos.server-addr}
nacos.config.namespace=${nacos.namespace}

# ============================================================
# 开发启动开关（参考 tse，VM 参数可覆盖；直连 prd Nacos 开发时保持默认即可）：
#   -Dnacos.server-addr=124.221.150.239:9848
#   -Dnacos.namespace=prd
#   -Dspring.cloud.nacos.discovery.register-enabled=false
#   -Ddubbo.enabled=false
#   -Dapp.gateway.trust-only=false
# ============================================================

# 不向 Nacos 注册服务（开发直连 prd 拉配置，避免污染 prd 服务注册表）
spring.cloud.nacos.discovery.register-enabled=${nacos.register-enabled:false}

# Dubbo 开关（开发直连 prd 时关闭，避免向 prd 注册/订阅 Dubbo 服务）
dubbo.enabled=false

# 网关信任模式：false = 校验签名但不强制内部信任头（开发联调用）
app.gateway.trust-only=false

logging.config=classpath:log4j2-spring.xml

# API 访问日志（Nacos 可覆盖）
# enabled=是否记录接口日志；brief=只打核心字段；service-trace-enabled=服务层轨迹（默认关）
# slow-threshold-ms=慢接口阈值；error-stack-trace=异常是否打完整堆栈
loan.api.log.enabled=true
loan.api.log.service-trace-enabled=false
loan.api.log.brief=true
loan.api.log.max-body-length=1024
loan.api.log.slow-threshold-ms=3000
loan.api.log.error-stack-trace=false

# Druid 慢 SQL（Nacos 可覆盖；日志关键字 slow sql / merge sql）
spring.datasource.druid.filters=stat
spring.datasource.druid.filter.stat.enabled=true
spring.datasource.druid.filter.stat.log-slow-sql=true
spring.datasource.druid.filter.stat.merge-sql=true
spring.datasource.druid.filter.stat.slow-sql-millis=500
spring.datasource.druid.stat-view-servlet.enabled=false

# 审计字段自动填充（created_by/updated_by 存操作人姓名）
mybatis-plus.global-config.db-config.meta-object-handler=com.loan.config.CustomMetaObjectHandler

# ============================================================
# 微信小程序（Q3 方案 A 登录主通道；密钥生产走 Nacos wechat.secret 覆盖）
# ============================================================
# 注意：以下配置曾使用 ${key:默认值} 自引用写法，当 Nacos / -D 未提供同名 key 时，
# Spring 解析默认值会判定为 Circular placeholder reference 导致启动失败。
# 现改为直接写默认值：本地即用此值启动，需要覆盖时由 Nacos 配置或 -D 启动参数提供（优先级更高）。
wechat.appid=wx_CHANGE_ME
wechat.secret=
# true=Mock code2session（本地/联调免真实凭证）；false=调微信 jscode2session
wechat.mock=true
# 手机号+短信验证码登录兼容开关（默认关，仅 wx.login 主通道；true 时管理端可手动建档）
mini.auth.phone-compat=false

# ============================================================
# 开发态「角色模拟」开关（多身份菜单/权限联调用）
# 开启后，请求头 X-Dev-Role: BOSS|DEPT_MANAGER|ADVISER|CHANNEL|CUSTOMER
# 会覆盖当前登录用户的 userType / roleCode，用于以不同身份验证菜单与接口权限。
# 安全约束：生产环境必须保持 false；仅允许本地/联调环境开启。
# ============================================================
loan.dev.role-override.enabled=false
# 允许被模拟的角色白名单（逗号分隔），不在白名单内的取值直接忽略
# 注意：此处不可写成 ${loan.dev.role-override.allowed:...} 自引用形式，
# Spring 解析默认值时会判定为 Circular placeholder reference 导致启动失败。
# 需要覆盖时用 Nacos 配置或 -D 启动参数传入即可。
loan.dev.role-override.allowed=BOSS,DEPT_MANAGER,ADVISER,CHANNEL,CUSTOMER

# ============================================================
# 材料上传（G3：匹配/认证材料真实数据流）
# ============================================================
# 上传文件大小限制（Nacos 可覆盖；默认 20MB，匹配前端「单文件 ≤ 20MB」文案，解决财务报表 PDF 体积问题）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# 材料落盘根目录（Nacos 可覆盖；默认项目相对 ./uploads，开发联调即 loan-service/uploads）
loan.upload.base-dir=./uploads

# ============================================================
# OCR 材料解析回灌诊断（#4b T2）
# provider: mock=阶段一模拟引擎（返回空事实，不报错）；tencent=真实腾讯云 OCR（后续按策略工厂切换）
# enabled: false 时 ingest 直接跳过，仅保留落盘附件（向后兼容）
# merge-only-blank: true=仅补空不覆盖用户手填值（事实合并铁律，勿关）
# ============================================================
loan.ocr.provider=mock
loan.ocr.enabled=true
loan.ocr.merge-only-blank=true

# ============================================================
# VLM 大模型视觉抽取（provider=vlm 时激活；缺省 mock，无需密钥即可启动）
# 协议：OpenAI 兼容的 chat/completions 多模态接口（通义千问 VL / GLM-4V / 本地 vLLM 等）
# 未配置 base-url / api-key 时自动降级为空事实（与 mock 行为一致，不阻断上传）
# ============================================================
loan.ocr.vlm.base-url=
loan.ocr.vlm.api-key=
loan.ocr.vlm.model=qwen-vl-max
loan.ocr.vlm.timeout-ms=60000
# loan.ocr.vlm.system-prompt=可选，覆盖默认抽取系统提示词

loan.mini.approval.types=ALLOCATION,MATERIAL_REVIEW
