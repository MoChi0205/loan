# ============================================================
# 本地固定引导配置（不随 dev/prd 变化；环境由 VM -Dnacos.server-addr / -Dnacos.namespace 指定）
# 业务与基础设施（含 MySQL/Redis/context-path）在 Nacos application.properties
# ============================================================
spring.application.name=loan-platform

nacos.config.group=loan
nacos.config.server-addr=${nacos.server-addr}
nacos.config.namespace=${nacos.namespace}

# ============================================================
# 开发启动开关（参考 tse，VM 参数可覆盖；直连 prd Nacos 开发时保持默认即可）：
#   -Dnacos.server-addr=124.221.150.239:9848
#   -Dnacos.namespace=prd
#   -Dspring.cloud.nacos.discovery.register-enabled=false
#   -Ddubbo.enabled=false
#   -Dapp.gateway.trust-only=false
# ============================================================

# 不向 Nacos 注册服务（开发直连 prd 拉配置，避免污染 prd 服务注册表）
spring.cloud.nacos.discovery.register-enabled=${nacos.register-enabled:false}

# Dubbo 开关（开发直连 prd 时关闭，避免向 prd 注册/订阅 Dubbo 服务）
dubbo.enabled=${dubbo.enabled:false}

# 网关信任模式：false = 校验签名但不强制内部信任头（开发联调用）
app.gateway.trust-only=${app.gateway.trust-only:false}

logging.config=classpath:log4j2-spring.xml

# 审计字段自动填充（created_by/updated_by 存操作人姓名）
mybatis-plus.global-config.db-config.meta-object-handler=com.loan.config.CustomMetaObjectHandler

# 慢 SQL 监控（Druid，Nacos 可覆盖）
spring.datasource.druid.filters=stat
spring.datasource.druid.filter.stat.enabled=true
spring.datasource.druid.filter.stat.log-slow-sql=true
spring.datasource.druid.filter.stat.slow-sql-millis=500
spring.datasource.druid.stat-view-servlet.enabled=false
