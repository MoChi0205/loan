# =============================================================================
# L3 集成测试专用配置（核心链路接「云上生产库」只读验证）
# -----------------------------------------------------------------------------
# 触发：必须显式 -Dloan.l3.enabled=true（surefire 已排除 l3 标签，默认绝不运行）。
# 安全基线：
#   1) 跳过远程 Nacos（NacosEnvironmentPostProcessor 在 l3 剖面下直接 return）；
#   2) 关闭 Nacos 配置中心 / 服务发现 / Dubbo 注册，避免任何对生产中间件的写入或注册；
#   3) 复用 nacos/config/prd/application.properties 的「连接形态」（主机:端口/库名），
#      但【凭证经环境变量注入、绝不入库】；真实密码在服务器 secrets.env。
#   4) 默认用只读账号 erp_ro；如需只读账号，请在云库执行 scripts/l3-readonly-user.sql。
# =============================================================================

spring.profiles.active=l3

# --- 关闭一切会连/写生产中间件的自动配置 ---
nacos.config.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.discovery.register-enabled=false
dubbo.enabled=false
# 微信等外部调用全部走 mock，避免对真实渠道产生副作用
wechat.mock=true

# --- 复用 PRD 连接形态（相对 loan-service 模块目录）---
spring.config.import=optional:file:../nacos/config/prd/application.properties

# --- 凭证：从环境变量注入，缺省占位符（运行前必须提供真实值）---
spring.datasource.password=${LOAN_PRD_DB_PASSWORD:CHANGE_ME_ERP_USER}
spring.redis.password=${LOAN_PRD_REDIS_PASSWORD:CHANGE_ME_REDIS}

# --- 只读账号优先：存在 erp_ro 时用它（需在云库创建，见 scripts/l3-readonly-user.sql）---
# 若云库仅提供 erp_user（读写），请保持 erp_user 并务必确认本套测试不含任何写操作。
spring.datasource.username=${LOAN_PRD_DB_USER:erp_user}
